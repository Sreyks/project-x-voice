<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <span class="logo">X</span>
            <button id="clearBtn" class="clear-btn" title="Очистить чат">Очистить</button>
        </header>

        <div class="chat" id="chat">
            <p class="empty-hint" id="emptyHint">Нажми на микрофон и скажи что-нибудь — сообщение появится здесь</p>
        </div>

        <p id="status" class="status"></p>

        <div class="input-bar">
            <button id="attachBtn" class="icon-btn" title="Скоро">
                <svg viewBox="0 0 24 24" width="22" height="22">
                    <path fill="currentColor" d="M17.5 6.5v8a4 4 0 1 1-8 0v-8a2.5 2.5 0 0 1 5 0v7.5a1 1 0 0 1-2 0V7h-1.5v7a2.5 2.5 0 0 0 5 0v-7.5a4 4 0 0 0-8 0v8a5.5 5.5 0 0 0 11 0v-8h-1.5z"/>
                </svg>
            </button>

            <div class="input-slot">
                <input id="textInput" class="text-input" type="text" placeholder="Скажи или напиши сообщение..." autocomplete="off">
                <div id="recordingIndicator" class="recording-indicator">
                    <span class="dot"></span>
                    <span id="recTimer">0:00</span>
                </div>
            </div>

            <button id="sendBtn" class="icon-btn send-btn" title="Отправить">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M3 20l18-8L3 4v6l12 2-12 2z"/>
                </svg>
            </button>

            <button id="micBtn" class="icon-btn mic-btn" title="Записать голосом">
                <svg class="icon mic-icon" viewBox="0 0 24 24" width="22" height="22">
                    <path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
                    <path fill="currentColor" d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/>
                </svg>
            </button>

            <button id="recStopBtn" class="icon-btn rec-stop-btn" title="Стоп — вставить текст для проверки">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/>
                </svg>
            </button>

            <button id="recSendBtn" class="icon-btn rec-send-btn" title="Отправить сразу">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M3 20l18-8L3 4v6l12 2-12 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
